
name: Fraud Detection MLOps CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API and Data Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run API and data pipeline tests without trained artifacts
        env:
          MODEL_PATH: __ci_missing_model__.joblib
          METRICS_PATH: __ci_missing_metrics__.json
        run: |
          python -m pytest tests/test_api.py tests/test_data_pipeline.py tests/test_gcs_reports.py -q -rs

  monitoring-tests:
    name: Evidently Monitoring Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-monitoring.txt

      - name: Install monitoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-monitoring.txt
          python -m pip check

      - name: Run monitoring unit tests
        run: |
          python -m pytest tests/test_drift_monitor.py -q -rs

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run React component tests
        run: npx vitest run --config vitest.config.ts

      - name: Build frontend
        run: npm run build

  proxy-tests:
    name: Cloud Run Development Proxy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-proxy-dev.txt

      - name: Install proxy test dependencies
        run: |
          python -m pip install -r requirements-proxy-dev.txt
          python -m pip check

      - name: Run proxy security and regression tests
        run: |
          python -m pytest tests/test_dev_cloud_run_proxy.py -q -rs
