name: CI/CD Docker Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code source
      uses: actions/checkout@v3

    - name: Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installation des dépendances et tests unitaires
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn xgboost mlflow scikit-learn pandas pydantic pytest httpx==0.27.2 starlette==0.37.2
        python -m pytest tests/

    - name: Vérification de l'environnement Docker
      run: docker --version

    - name: Build de l'image Docker de l'API
      run: docker build -t fraud-detection-api:latest .

    - name: Succès du Build
      run: echo "L'image Docker a été construite avec succès dans un environnement Linux propre."
